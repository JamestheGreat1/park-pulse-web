name: Read-only EPCOT Living with the Land feed audit
on:
  pull_request:
    paths:
      - .github/workflows/audit-land-feed.yml
      - tests/land-feed-audit.mjs
permissions:
  contents: read
jobs:
  inspect:
    name: Compare ParkPulse and both public EPCOT feeds
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public feed snapshots without credentials or writes
        run: node tests/land-feed-audit.mjs
