name: ParkPulse checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Worker and UI regression tests
        run: node --test tests/regressions.test.mjs tests/alert-queue.test.mjs tests/staging.test.mjs

  browser:
    name: PWA browser and offline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/parkpulse-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/version.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parkpulse-http.log
          exit 1
      - name: Run browser smoke test
        run: node tests/browser-smoke.cjs
      - name: Generate isolated staging frontend preview
        run: node worker/scripts/build-staging.mjs --database-id 11111111-1111-4111-8111-111111111111 --enable-history-cron --preview-url https://parkpulse-api-staging.jamesp5297.workers.dev
      - name: Start staging frontend fixture
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory .parkpulse-staging/site > /tmp/parkpulse-staging-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8768/version.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parkpulse-staging-http.log
          exit 1
      - name: Run generated staging frontend smoke test
        run: node tests/staging-preview-smoke.cjs

  worker-bundle:
    name: Worker bundling smoke test (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-save --package-lock=false
      - name: Dry-run Cloudflare Worker bundling
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir ./dry-run
      - name: Generate isolated staging Worker build (fake test UUID; no Cloudflare access)
        run: node worker/scripts/build-staging.mjs --database-id 11111111-1111-4111-8111-111111111111 --enable-history-cron --preview-url https://parkpulse-api-staging.jamesp5297.workers.dev
      - name: Install staging Worker dependencies
        working-directory: .parkpulse-staging/worker
        run: npm install --no-save --package-lock=false
      - name: Dry-run the generated staging Worker bundle
        working-directory: .parkpulse-staging/worker
        run: npx wrangler deploy --config ./wrangler.toml --dry-run --outdir ./dry-run

  source-audit:
    name: Read-only Disneyland provider coverage audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe current Disneyland & DCA provider payloads (no secrets)
        run: node worker/scripts/audit-disneyland-sources.mjs
