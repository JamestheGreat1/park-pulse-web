name: ParkPulse 2.1 hosted-preview check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preview-2-1-live.yml
      - preview-2-1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-preview:
    name: Verify public preview and stable app
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Wait for GitHub Pages and verify isolated preview files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://app.useparkpulse.com"
          for attempt in $(seq 1 24); do
            echo "Checking hosted preview (attempt ${attempt}/24)"
            if curl -fsSL --max-time 12 "${BASE}/preview-2-1/version.json?verify=${GITHUB_RUN_ID}" -o /tmp/preview-version.json \
              && grep -q '"version": "2.1.0-preview"' /tmp/preview-version.json \
              && curl -fsSL --max-time 12 "${BASE}/preview-2-1/?verify=${GITHUB_RUN_ID}" -o /tmp/preview-index.html \
              && grep -q '2.1 DEV PREVIEW' /tmp/preview-index.html \
              && grep -q '2.1.0-preview.vg4' /tmp/preview-index.html \
              && curl -fsSL --max-time 12 "${BASE}/preview-2-1/assets/js/push.js?v=2.1.0-preview" -o /tmp/preview-push.js \
              && grep -q 'deliberately read-only' /tmp/preview-push.js \
              && curl -fsSL --max-time 12 "${BASE}/preview-2-1/assets/css/app.css?v=2.1.0-preview.vg4" -o /tmp/preview-style.css \
              && grep -q 'Vibrant Glass' /tmp/preview-style.css \
              && grep -q 'compact refinement: centered fixed-width' /tmp/preview-style.css \
              && grep -q 'ParkPulse 2.1 — unified overview details' /tmp/preview-style.css \
              && grep -q 'integrated closed state' /tmp/preview-style.css \
              && curl -fsSL --max-time 12 "${BASE}/preview-2-1/assets/js/app.js?v=2.1.0-preview.vg4" -o /tmp/preview-app.js \
              && grep -q 'dashboard-filter-row' /tmp/preview-app.js \
              && grep -q 'dashboard-stat-label' /tmp/preview-app.js \
              && grep -q 'dashboardConditionMarkup' /tmp/preview-app.js \
              && curl -fsSL --max-time 12 "${BASE}/version.json?verify=${GITHUB_RUN_ID}" -o /tmp/production-version.json \
              && grep -q '"version": "2.0.0"' /tmp/production-version.json; then
              echo "PASS: public 2.1 preview loads, preview writes are disabled, and stable root is still 2.0.0"
              exit 0
            fi
            sleep 10
          done
          echo "FAIL: public preview not yet available or stable app version changed"
          exit 1
