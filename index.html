<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07182e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ParkPulse">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="ParkPulse — a personal Walt Disney World park-day assistant for waits, plans, favorites, and smarter next-up suggestions.">
  <title>ParkPulse</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar glass">
      <div class="brand-wrap">
        <img class="brand-icon" src="./assets/icons/icon-192.png" alt="" width="42" height="42">
        <div>
          <p class="eyebrow">Walt Disney World</p>
          <h1>ParkPulse</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh live wait times" title="Refresh waits">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </header>

    <div id="networkBanner" class="network-banner hidden" role="status" aria-live="polite"></div>

    <main id="mainContent" class="main-content">
      <section id="tab-for-you" class="tab-panel active" data-tab-panel="for-you" aria-labelledby="tab-for-you-button"></section>
      <section id="tab-plan" class="tab-panel" data-tab-panel="plan" aria-labelledby="tab-plan-button"></section>
      <section id="tab-waits" class="tab-panel" data-tab-panel="waits" aria-labelledby="tab-waits-button"></section>
      <section id="tab-favorites" class="tab-panel" data-tab-panel="favorites" aria-labelledby="tab-favorites-button"></section>
      <section id="tab-settings" class="tab-panel" data-tab-panel="settings" aria-labelledby="tab-settings-button"></section>
    </main>

    <nav class="tabbar glass" aria-label="Primary">
      <button id="tab-for-you-button" class="tab-button active" type="button" data-tab="for-you" aria-controls="tab-for-you" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">✦</span><span>For You</span>
      </button>
      <button id="tab-plan-button" class="tab-button" type="button" data-tab="plan" aria-controls="tab-plan" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">☷</span><span>Plan</span>
      </button>
      <button id="tab-waits-button" class="tab-button" type="button" data-tab="waits" aria-controls="tab-waits" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">◷</span><span>Waits</span>
      </button>
      <button id="tab-favorites-button" class="tab-button" type="button" data-tab="favorites" aria-controls="tab-favorites" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">☆</span><span>Favorites</span>
      </button>
      <button id="tab-settings-button" class="tab-button" type="button" data-tab="settings" aria-controls="tab-settings" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">⚙︎</span><span>Settings</span>
      </button>
    </nav>

    <aside id="parkDayPill" class="park-day-pill glass hidden" aria-live="polite"></aside>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">ParkPulse needs JavaScript enabled to load live waits and your plan.</div>
  </noscript>

  <script src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
